<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1000" role="img" aria-labelledby="t d">
<title id="t">How SPASIX works</title>
<desc id="d">Game telemetry, motion cueing, kinematics, control, actuation, the platform: the signal from the game to the motors, then motion from the motors to the seat.</desc>
<style>
  .sig { stroke: #ff6a1a; stroke-width: 2.5; fill: none; }
  .mech { stroke: #9aa1ab; stroke-width: 6; stroke-linecap: round; fill: none; }
  .tile { fill: #121419; stroke: rgba(255, 255, 255, 0.16); stroke-width: 1.5; }
  .icon { fill: none; stroke: #c9ced6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .name { fill: #eef0f3; font: 700 18px Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; letter-spacing: -0.01em; }
  .num { fill: #9aa1ab; font: 600 12px Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; letter-spacing: 0.18em; }
  .dot { fill: #ff6a1a; animation: travel 6s linear infinite; transform-box: view-box; }
  @keyframes travel {
    0% { transform: none; fill: #ff6a1a; r: 5px; }
    79.9% { fill: #ff6a1a; r: 5px; }
    80.0% { fill: #c9ced6; r: 8px; }
    100% { transform: translateY(840px); fill: #c9ced6; r: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: 0; } }
</style>
